services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: trace
      POSTGRES_USER: trace
      POSTGRES_PASSWORD: trace-dev-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trace -d trace"]
      interval: 5s
      timeout: 3s
      retries: 10

  rustfs-permissions:
    image: alpine:3.21
    command: ["sh", "-c", "chown -R 10001:10001 /data"]
    volumes:
      - rustfs-data:/data
    restart: "no"

  rustfs:
    image: ghcr.io/rustfs/rustfs@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"
    volumes:
      - rustfs-data:/data
    ports:
      - "127.0.0.1:9001:9001"
    depends_on:
      rustfs-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "sh", "-ec", "curl -fsS http://127.0.0.1:9000/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  storage-init:
    build:
      context: ./backend
    command: ["python", "scripts/init_object_storage.py"]
    env_file:
      - .env
    depends_on:
      rustfs:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    environment:
      TRACE_API_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  rustfs-data:
